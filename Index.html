<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body> 
  <main class="main-content">
    <!-- <section>
    <div class="searchBar">
        <button id="NewTaskBtn">New Task</button>
        Add Search Bar Here 
        <input type="text" id="searchInput" placeholder="Search tasks...">
    </div>
    </section>
 --> 
  <nav class="navbar">
    <h1 class="nav-title">To-Do List</h1>
    <ul class="nav-links">
        <li><a href="#account">Account</a></li>
        <li><a href="#settings">Settings</a></li>
        <li><a href="#calendar">Calendar</a></li>
        <li><a href="#reminder">Reminder</a></li>
        <li><a href="#theme">Theme</a></li>
        <li><a href="#feedback">Feedback</a></li>
    </ul>
  </nav>
  <section class="workspace">
  <button id="NewTaskBtn">New Task</button>
   <!-- <input  class = "searchBar" type="text" id="searchInput" placeholder="Search tasks..."> -->
   <div class="filter-container">
     <!-- SearchBar -->
    <input  class = "searchBar" type="text" id="searchInput" placeholder="Search tasks...">
    <!-- Status filter -->
    <select id="statusFilter" class="filter-dropdown">
        <option value="All">All Status</option>
        <option value="Active">Active</option>
        <option value="Completed">Completed</option>
    </select>

    <!-- Priority filter -->
    <select id="priorityFilter" class="filter-dropdown">
        <option value="All">All Priority</option>
        <option value="High">High</option>
        <option value="Medium">Medium</option>
        <option value="Low">Low</option>
    </select>
</div>
<div class="container">
    <div class="card">
        <form id="taskForm" action="">
            <input type="text" id="taskInput" placeholder="Add a new task...">
            
            <label for="priorityInput">Priority:</label>
            <select id="priorityInput">
                <option value="Low">Low</option>
                <option value="Medium" selected>Medium</option>
                <option value="High">High</option>
            </select>

             <label for="dueDateInput">Due Date:</label>
            <input type="date" id="dueDateInput">
            <button type="submit" id="addTaskButton">Add Task</button>
        </form>
    </div>

</div>
<div id="tasksContainer" class="tasks-grid"></div>

  </section>
</main>
</body>
<script src="script.js"></script>
</html>
